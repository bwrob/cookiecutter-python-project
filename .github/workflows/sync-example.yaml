name: Sync Showcase Example

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch of zenith-example to push to"
        required: false
        default: "main"

concurrency:
  group: sync-showcase
  cancel-in-progress: true

jobs:
  sync-showcase:
    name: Sync zenith-example showcase
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Zenith template
        uses: actions/checkout@v4
        with:
          path: zenith

      - name: Checkout zenith-example showcase
        uses: actions/checkout@v4
        with:
          repository: bwrob/zenith-example
          path: zenith-example
          ssh-key: ${{ secrets.EXAMPLE_REPO_DEPLOY_KEY }}
          ref: ${{ github.event.inputs.target_branch || 'main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync showcase repository
        run: |
          cd zenith
          uv run python scripts/sync_example.py ../zenith-example

      - name: Commit and push changes
        run: |
          cd zenith-example
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes in showcase to commit."
          else
            git commit -m "chore(showcase): sync with bwrob/zenith@${{ github.sha }}"
            git push origin HEAD:${{ github.event.inputs.target_branch || 'main' }}
          fi
