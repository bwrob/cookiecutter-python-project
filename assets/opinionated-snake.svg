<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Ring Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Snake Scales Gradients -->
    <linearGradient id="snakePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="snakeSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sunglasses Gradient -->
    <linearGradient id="sunglassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Sunglasses Glare -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield Base -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>

  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#ringGrad)" stroke-width="4" filter="url(#dropShadow)"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Background Ambience -->
  <circle cx="200" cy="180" r="110" fill="url(#glowGrad)"/>

  <!-- Snake Body Group -->
  <g filter="url(#dropShadow)">
    <!-- Lower Body Coil (Gold/Secondary Pythonic Accents) -->
    <path d="M 120 280 C 100 240, 130 190, 190 200 C 250 210, 290 270, 240 310 C 200 340, 140 320, 120 280 Z"
          fill="url(#snakeSecondary)" opacity="0.95"/>

    <path d="M 140 290 C 130 260, 160 220, 205 230 C 245 240, 265 285, 230 305 C 200 320, 160 315, 140 290 Z"
          fill="#0f172a" opacity="0.3"/>

    <!-- Main Upper Body S-Curve (Emerald/Cyan Primary) -->
    <path d="M 190 320 C 270 330, 310 240, 280 180 C 255 130, 190 125, 195 75 C 200 35, 130 50, 130 90 C 130 150, 240 140, 230 220 C 220 280, 150 270, 120 280"
          fill="none" stroke="url(#snakePrimary)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Snake Head (Poised, Sharp, Confident) -->
    <path d="M 130 88 C 110 82, 100 95, 105 112 C 110 128, 140 142, 175 132 C 200 125, 205 105, 192 92 C 178 78, 150 82, 130 88 Z"
          fill="url(#snakePrimary)"/>

    <!-- Jaw Line -->
    <path d="M 105 112 C 120 126, 155 132, 185 120"
          fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round"/>

    <!-- Tongue (Flicking with Attitude) -->
    <path d="M 103 108 L 75 106 L 62 94 M 75 106 L 62 118"
          fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cool "Opinionated" Sunglasses -->
    <!-- Left Lens Frame & Glass -->
    <polygon points="120,95 152,94 148,116 122,114" fill="url(#sunglassesGrad)" stroke="#09090b" stroke-width="2.5"/>
    <!-- Right Lens Frame & Glass -->
    <polygon points="158,94 188,90 185,110 156,114" fill="url(#sunglassesGrad)" stroke="#09090b" stroke-width="2.5"/>
    <!-- Sunglasses Bridge -->
    <path d="M 151 97 Q 155 93 159 97" fill="none" stroke="#09090b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Left Brow Extension -->
    <path d="M 116 96 L 122 95" fill="none" stroke="#09090b" stroke-width="3" stroke-linecap="round"/>

    <!-- Glare Lines across sunglasses (attitude reflection) -->
    <polygon points="124,96 132,96 126,114 122,114" fill="url(#glareGrad)" opacity="0.85"/>
    <polygon points="135,96 138,96 132,114 130,114" fill="url(#glareGrad)" opacity="0.6"/>

    <polygon points="162,94 170,93 164,111 160,112" fill="url(#glareGrad)" opacity="0.85"/>
    <polygon points="173,93 176,92 170,110 168,110" fill="url(#glareGrad)" opacity="0.6"/>

    <!-- Smug Smirk / Smile -->
    <path d="M 132 124 Q 148 132 165 125" fill="none" stroke="#064e3b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Stars / Zen Sparks -->
  <path d="M 290 85 L 293 95 L 303 98 L 293 101 L 290 111 L 287 101 L 277 98 L 287 95 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 315 130 L 317 137 L 324 139 L 317 141 L 315 148 L 313 141 L 306 139 L 313 137 Z" fill="#fbbf24" opacity="0.85"/>
  <path d="M 90 200 L 92 205 L 97 207 L 92 209 L 90 214 L 88 209 L 83 207 L 88 205 Z" fill="#10b981" opacity="0.75"/>

  <!-- Emblem Text Banner at Bottom -->
  <g filter="url(#dropShadow)">
    <rect x="90" y="325" width="220" height="42" rx="21" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="2.5"/>
    <text x="200" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4" fill="#f8fafc">
      ZENITH
    </text>
  </g>
</svg>
