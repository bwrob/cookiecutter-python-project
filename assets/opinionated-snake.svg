<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Obsidian Void Gradient -->
    <radialGradient id="spaceVoid" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Star Core Radiant Bloom -->
    <radialGradient id="starBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Zenith Beams -->
    <linearGradient id="verticalBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0"/>
    </linearGradient>

    <!-- Primary Diamond Facet Gradient (Crisp Stellar White & Ice Cyan) -->
    <linearGradient id="facetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="facetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Secondary Facet Gradient (Silver Slate) -->
    <linearGradient id="facetSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="celestialRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="zenithGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Celestial Medallion -->
  <circle cx="200" cy="200" r="188" fill="url(#spaceVoid)"/>

  <!-- Guiding Light Column projecting down from the Northern Star -->
  <polygon points="200,60 235,320 165,320" fill="url(#verticalBeam)"/>

  <!-- Astronomical Astrolabe & Coordinate Grid Rings -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#celestialRing)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 6"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="200" cy="200" r="95" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 4"/>

  <!-- Celestial Horizon & Meridian Lines -->
  <line x1="200" y1="20" x2="200" y2="380" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.35"/>
  <line x1="20" y1="200" x2="380" y2="200" stroke="#334155" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.35"/>

  <!-- Compass Cardinal Ticks (Guiding to Zenith) -->
  <polygon points="200,16 204,26 196,26" fill="#38bdf8"/>
  <line x1="200" y1="372" x2="200" y2="382" stroke="#475569" stroke-width="1.5"/>
  <line x1="18" y1="200" x2="28" y2="200" stroke="#475569" stroke-width="1.5"/>
  <line x1="372" y1="200" x2="382" y2="200" stroke="#475569" stroke-width="1.5"/>

  <!-- Guiding Navigation Constellation Points -->
  <circle cx="105" cy="115" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="128" cy="90" r="2" fill="#e0f2fe" opacity="0.75"/>
  <line x1="105" y1="115" x2="128" y2="90" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.3"/>

  <circle cx="295" cy="115" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="272" cy="90" r="2" fill="#e0f2fe" opacity="0.75"/>
  <line x1="295" y1="115" x2="272" y2="90" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- THE ZENITH GUIDING STAR (NORTHERN STAR / POLARIS) -->
  <g filter="url(#dropShadow)" transform="translate(200, 185)">
    <!-- Ambient Starlight Glow -->
    <circle cx="0" cy="0" r="60" fill="url(#starBloom)"/>

    <!-- Concentric Guiding Light Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.5"/>

    <!-- 4 Diagonal Faceted Diamond Rays -->
    <g transform="rotate(45)">
      <!-- Top-right ray -->
      <polygon points="0,0 6,-8 0,-52 -6,-8" fill="url(#facetSilver)" opacity="0.9"/>
      <polygon points="0,0 8,6 52,0 8,-6" fill="url(#facetSilver)" opacity="0.75"/>
      <polygon points="0,0 6,8 0,52 -6,8" fill="url(#facetSilver)" opacity="0.9"/>
      <polygon points="0,0 -8,6 -52,0 -8,-6" fill="url(#facetSilver)" opacity="0.75"/>
    </g>

    <!-- 4 Primary Cardinal Faceted Rays (Reaching toward Zenith) -->
    <!-- Upward Ray (The Zenith Apex Ray - Elongated to Zenith) -->
    <polygon points="0,0 10,-14 0,-105 -10,-14" fill="url(#facetWhite)" filter="url(#zenithGlow)"/>
    <polygon points="0,0 0,-105 10,-14" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,0 0,-105 -10,-14" fill="url(#facetCyan)" opacity="0.9"/>

    <!-- Downward Ray (Guiding Ray) -->
    <polygon points="0,0 9,12 0,72 -9,12" fill="url(#facetWhite)"/>
    <polygon points="0,0 0,72 9,12" fill="#ffffff" opacity="0.85"/>
    <polygon points="0,0 0,72 -9,12" fill="url(#facetCyan)" opacity="0.85"/>

    <!-- Right Horizontal Ray -->
    <polygon points="0,0 12,-9 72,0 12,9" fill="url(#facetWhite)"/>
    <polygon points="0,0 72,0 12,-9" fill="#ffffff" opacity="0.85"/>
    <polygon points="0,0 72,0 12,9" fill="url(#facetCyan)" opacity="0.85"/>

    <!-- Left Horizontal Ray -->
    <polygon points="0,0 -12,-9 -72,0 -12,9" fill="url(#facetWhite)"/>
    <polygon points="0,0 -72,0 -12,-9" fill="#ffffff" opacity="0.85"/>
    <polygon points="0,0 -72,0 -12,9" fill="url(#facetCyan)" opacity="0.85"/>

    <!-- Core Star Diamond Centerpiece -->
    <polygon points="0,-16 12,0 0,16 -12,0" fill="#ffffff" filter="url(#zenithGlow)"/>
    <polygon points="0,-12 9,0 0,12 -9,0" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Clean, Modern Minimalist Typographic Plinth -->
  <g filter="url(#dropShadow)">
    <text x="200" y="348" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'SF Pro Display', sans-serif"
          font-size="16" font-weight="800" letter-spacing="10" fill="#f8fafc">
      ZENITH
    </text>
    <!-- Coordinate Subtitle Dots -->
    <circle cx="132" cy="343" r="1.5" fill="#38bdf8"/>
    <circle cx="268" cy="343" r="1.5" fill="#38bdf8"/>
  </g>
</svg>
