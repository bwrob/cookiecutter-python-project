# ==============================================================================
# Pytest Configuration (pytest.ini)
#
# Tool: Pytest (https://docs.pytest.org/)
# Purpose: The standard testing framework for Python applications and libraries.
# Why it's in Zenith: Configured with verbose outputs, doctest discovery, strict
# config/marker checks, import isolation, zero-tolerance warning gates, and
# integration with pytest-cov for coverage measurement on every test run.
# ==============================================================================

[pytest]
addopts                = --verbose --doctest-modules --import-mode=importlib --strict-config --strict-markers
collect_imported_tests = false
console_output_style   = classic
minversion             = 8.0
testpaths              = tests src
xfail_strict           = true
filterwarnings         =
    error
    ignore::EncodingWarning:pytest_sugar.*
    ignore::EncodingWarning:tach.*
doctest_optionflags    =
    NORMALIZE_WHITESPACE
    ELLIPSIS

