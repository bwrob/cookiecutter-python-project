# ==============================================================================
# Pytest Configuration (pytest.ini)
#
# Tool: Pytest (https://docs.pytest.org/)
# Purpose: The standard testing framework for Python applications and libraries.
# Why it's in Zenith: Configured with verbose outputs, doctest discovery, and
# integrated with pytest-cov for coverage measurement on every test run.
# ==============================================================================

[pytest]
addopts                = --verbose --doctest-modules
collect_imported_tests = false
console_output_style   = classic
minversion             = 8.0
testpaths              = tests src
