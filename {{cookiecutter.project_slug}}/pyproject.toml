# ==============================================================================
# Python Project Specification (pyproject.toml)
#
# Tool: PEP 517 / PEP 621 Standard Packaging via uv_build
# Purpose: Declarative project metadata, dependencies, scripts, and build system.
# Why it's in Zenith: Uses uv's native high-performance build backend (uv_build)
# and modern dependency groups (dev) for lightning-fast, reproducible installs.
# ==============================================================================

[project]
    authors = [
        { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
    ]
    classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        {% if cookiecutter.python_version <= "3.12" %}
        "Programming Language :: Python :: 3.12",
        {% endif %}
        {% if cookiecutter.python_version <= "3.13" %}
        "Programming Language :: Python :: 3.13",
        {% endif %}
        {% if cookiecutter.python_version <= "3.14" %}
        "Programming Language :: Python :: 3.14",
        {% endif %}
        "Programming Language :: Python :: 3.15",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Typing :: Typed",
    ]
    {% if cookiecutter.include_cli in [True, "yes", "true", "True", "1"] %}
    dependencies = [ "rich>=14.0.0", "typer>=0.16.0" ]
    {% else %}
    dependencies = [  ]
    {% endif %}
    description = "{{ cookiecutter.description }}"
    name = "{{ cookiecutter.project_slug }}"
    readme = "README.md"
    requires-python = ">={{ cookiecutter.python_version }}"
    version = "{{ cookiecutter.version }}"

    [project.urls]
        Documentation = "https://{{ cookiecutter.github_username }}.github.io/{{ cookiecutter.project_slug }}/"
        Homepage      = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}"
        Issues        = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}/issues"
        Repository    = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}.git"

    {% if cookiecutter.include_cli in [True, "yes", "true", "True", "1"] %}
    [project.scripts]
        {{ cookiecutter.project_slug }} = "{{ cookiecutter.package_name }}.__main__:main"
    {% endif %}

[build-system]
    build-backend = "uv_build"
    requires      = [ "uv_build>=0.12.7,<0.13.0" ]

[dependency-groups]
    dev = [
        "poethepoet>=0.42.0",
        { include-group = "test" },
        { include-group = "lint" },
        { include-group = "docs" },
    ]
    docs = [
        "markdown-exec>=1.12.0",
        "mkdocstrings[python]>=0.28.0",
        "typst>=0.13.0",
        "zensical>=0.0.70",
    ]
    lint = [
        "complexipy>=8.0.0",
        "pre-commit>=4.5.0",
        "pyrefly>=1.3.0",
        "ruff>=0.17.0",
        "rumdl>=0.2.75",
        "tach>=0.35.0",
        "typos>=1.30.0",
        "zizmor>=1.23.0",
    ]
    test = [
        "hypothesis>=6.125.0",
        "pytest>=9.0.0",
        "pytest-cov>=7.0.0",
        "pytest-randomly>=3.16.0",
        "pytest-sugar>=1.0.0",
        "pytest-xdist>=3.8.0",
        "syrupy>=6.1.0",
    ]

[tool.uv]
    default-groups = [ "dev", "test", "lint", "docs" ]
    package        = true
    # Supply-chain protection buffer against zero-day compromised upstream releases.
    # Uncomment to exclude packages published in the last N days during resolution:
    # exclude-newer  = "7 days"

[tool.uv.build-backend]
    source-include = [
        "tests/**",
        "poe_tasks.toml",
        "ruff.toml",
        "pytest.ini",
        ".coveragerc",
        "tach.toml",
        ".zizmor.yml",
    ]

[tool.poe]
    include = "poe_tasks.toml"
