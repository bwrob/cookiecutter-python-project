# ==============================================================================
# Typos Configuration (typos.toml)
#
# Tool: Typos (https://github.com/crate-ci/typos)
# Purpose: Source code and documentation spell checker written in Rust.
# Why it's in Zenith: Blazingly fast spell checker that catches spelling errors
# in code, docstrings, markdown, and configs before they reach production.
# ==============================================================================

[files]
extend-exclude = [
    "*.ambr",
    "*.min.js",
    "*.svg",
    "build",
    "dist",
    "site",
]

[default.extend-words]
CPY = "CPY"
