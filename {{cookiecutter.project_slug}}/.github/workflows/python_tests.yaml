{% raw %}name: Package Tests

env:
  UV_NO_SYNC: true

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: 🐍 Python Tests and Quality Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: 🛠️ Check out repository
        uses: actions/checkout@v4

      - name: 🛠️ Install uv and use Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 🛠️ Install project dependencies
        run: uv sync --dev

      - name: 🐍 Run ruff linter check
        if: always()
        run: uv run poe lint

      - name: 🐍 Run ruff formatter check
        if: always()
        run: uv run ruff format --check .

      - name: 🐍 Run pyrefly static type checker
        if: always()
        run: uv run poe type-check

      - name: 🧮 Run complexipy complexity check
        if: always()
        run: uv run poe complexity

      - name: 📝 Run rumdl markdown linter
        if: always()
        run: uv run poe lint-md

      - name: 📐 Run tach architecture check
        if: always()
        run: uv run poe dependencies

      - name: 🧪 Run pytest suite
        if: always()
        run: uv run poe test

  check:
    name: 🛠️ All Checks Status
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all required matrix jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
{% endraw %}
