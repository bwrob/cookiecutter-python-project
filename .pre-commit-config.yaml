# ==============================================================================
# Repository Pre-commit Configuration (.pre-commit-config.yaml)
#
# Tool: Pre-commit (https://pre-commit.com/)
# Purpose: Git hook management for the cookiecutter-zenith template repository.
# Note: Excludes unrendered Jinja template directory ({{cookiecutter.project_slug}}/)
# ==============================================================================

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false

exclude: '^{{cookiecutter\.project_slug}}/'

repos:
  - repo: https://github.com/pre-commit/pre-commit
    rev: v4.6.2
    hooks:
      - id: validate_manifest
        name: "🛠️ pre-commit · Validate pre-commit configuration"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
        name: "🛠️ pre-commit · Check for case conflicts"
      - id: check-merge-conflict
        name: "🛠️ pre-commit · Check for merge conflicts"
      - id: check-yaml
        name: "🛠️ pre-commit · Check YAML files"
      - id: end-of-file-fixer
        name: "🛠️ pre-commit · Fix end of file"
      - id: mixed-line-ending
        name: "🛠️ pre-commit · Check mixed line endings"
      - id: trailing-whitespace
        name: "🛠️ pre-commit · Check trailing whitespace"
      - id: check-json
        name: "🛠️ pre-commit · Check JSON files"
      - id: check-added-large-files
        name: "🛠️ pre-commit · Check for large files"
        args: ["--maxkb=2000"]
      - id: check-toml
        name: "🛠️ pre-commit · Check TOML files"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        name: "🐍 validate-pyproject · Validate pyproject.toml"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        name: "🐍 ruff · Check Python code"
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
        name: "🐍 ruff · Format Python code"

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: "⚙️ taplo · Format TOML files"
